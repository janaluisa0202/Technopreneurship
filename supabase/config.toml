# Supabase CLI configuration for LOCAL development only (`npx supabase start`, `npx supabase db reset`).
# Hosted project settings are configured in the Supabase dashboard (see docs/BACKEND_INTEGRATION.md).
project_id = "sakaywise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
# Guests use anonymous sign-ins; required for queue reports and support messages in live mode.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP. Also consider enabling CAPTCHA on the hosted project.
anonymous_users = 30
